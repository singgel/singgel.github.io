name: Refresh AI data
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-ai-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the last data checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/ai-hub"
          if git ls-remote --exit-code --heads origin data/ai > /dev/null; then
            git fetch origin data/ai:refs/remotes/origin/data/ai
            git show origin/data/ai:data/ai.json > "$RUNNER_TEMP/ai-hub/previous.json"
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            cp data/ai.json "$RUNNER_TEMP/ai-hub/previous.json"
          fi
      - name: Verify the collector
        run: python3 -m unittest discover -s tests -p 'test_ai_hub.py'
      - name: Refresh public sources
        run: python3 scripts/update_ai_hub.py --previous "$RUNNER_TEMP/ai-hub/previous.json" --output "$RUNNER_TEMP/ai-hub/ai.json"
      - name: Publish only the public data checkpoint
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/data/ai; then
            git switch -C data/ai origin/data/ai
          else
            git switch --orphan data/ai
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/ai-hub/ai.json" data/ai.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public AI data'
          test "$(git ls-tree -r --name-only HEAD)" = 'data/ai.json'
          git push origin HEAD:data/ai
          actual=$(git ls-remote --exit-code origin refs/heads/data/ai | cut -f1)
          test "$actual" = "$(git rev-parse HEAD)"
